name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8
      - run: deno fmt --check
      - run: deno lint
      - run: deno task check
      - run: deno task test
      - run: deno task compile

  # rev matches .pre-commit-config.yaml. Absence of Assisted-by is allowed.
  commit-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check Assisted-by trailers
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          PROVENANCE_REV: v0.1.0
        run: |
          set -euo pipefail
          script="$(mktemp -d)/check-commit-provenance.mjs"
          curl -fsSL "https://raw.githubusercontent.com/Tiryoh/commit-provenance/${PROVENANCE_REV}/scripts/check-commit-provenance.mjs" -o "${script}"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            if [ -z "${BASE_SHA}" ]; then
              echo "pull request base SHA is missing" >&2
              exit 1
            fi
            range="${BASE_SHA}..HEAD"
          elif [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            range="HEAD"
          else
            range="${BEFORE}..HEAD"
          fi
          node "${script}" --range "${range}"
